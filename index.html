 else if(k=='skin'){h=`<h2>🎨 Skins-Shop</h2><p>💰 <b>${D.coins}</b> · ${D.own.length}/${SK.length} freigeschaltet</p><div class="grid">`;SK.forEach((s,i)=>{const o=D.own.includes(i),r=s.p>=1500?['Legendär','#ffb000']:s.p>=500?['Episch','#9272f5']:s.p>0?['Selten','#4a86e8']:['Gewöhnlich','#8d99ae'];h+=`<div class="sk" style="--rc:${r[1]}"><span class="rb" style="background:${r[1]}">${r[0]}</span><canvas class="pv" width="84" height="96" data-k="${i}"></canvas><b>${s.n}</b>${D.skin==i?'<button class="b br" disabled>✔ Aktiv</button>':o?`<button class="b" data-a="ss" data-v="${i}">Wählen</button>`:`<button class="b by" data-a="bs" data-v="${i}" ${D.coins<s.p?'disabled':''}>${s.p} 💰</button>`}</div>`});h+=`</div>`}
 else if(k=='lb')h=`<h2>🏆 Rangliste</h2><div class="lb" id="lbl">Lade…</div>`;
 else if(k=='set')h=`<h2>⚙️ Setup</h2>${D.acc?`<div class="box" style="width:100%"><b>👤 ${esc(D.acc.name)}</b><p>Fortschritt &amp; Rekord werden in der Cloud gespeichert.</p><button class="b bg" data-a="out">Abmelden</button></div>`:`<div class="box auth"><div class="tabs"><button class="${am=='login'?'on':''}" data-a="am" data-v="login">Anmelden</button><button class="${am=='reg'?'on':''}" data-a="am" data-v="reg">Registrieren</button></div><p class="hint">${am=='reg'?'Neuen Account erstellen – dein Fortschritt wird in der Cloud gespeichert.':'Willkommen zurück! Melde dich für Rangliste &amp; Cloud-Speicher an.'}</p><input id="an" value="${esc(lastN)}" placeholder="Name" maxlength="16" autocomplete="username" autocapitalize="none"><div class="pw"><input id="ap" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="${am=='reg'?'new-password':'current-password'}"><button class="eye" data-a="eye" type="button">👁</button></div>${am=='reg'?'<input id="ap2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">':''}<p id="ae" class="err"></p><button class="b play" id="ago" data-a="go">${am=='reg'?'Account erstellen':'Anmelden'}</button></div>`}<button class="b ${D.tilt?'bl':'bg'}" data-a="tilt">📱 Neigung: ${D.tilt?'An':'Aus'}</button><button class="b bg" data-a="sens">🎚 Empfindlichkeit: ${D.sens==.7?'Niedrig':D.sens==1.5?'Hoch':'Normal'}</button><button class="b ${D.mute?'bg':'by'}" data-a="snd">🔊 Ton: ${D.mute?'Aus':'An'}</button><button class="b bg" data-a="tut">❓ Anleitung</button>${tiltFail?'<p class="hint">Kein Neigungssensor erlaubt/gefunden – nutze Touch.</p>':''}`;
 else h=`<h2>Anleitung</h2><div class="hint"><p><b>Steuern:</b> Handy nach links/rechts neigen (im Hauptmenü an/aus), links/rechts auf den Bildschirm halten, oder ← → / A D.</p><p><b>Schießen:</b> 🔫-Knopf oder Leertaste.</p><p><b>Gegner:</b> von oben draufspringen oder abschießen.</p><p>🚀 Jetpack · 🛡️ Schild · 🟥 Sprungfeder · 💰 Münzen (Magnet-Upgrade!)</p><p>Grüne Plattformen sind sicher, blaue wandern, braune brechen, Wolken verschwinden. Höher kommst du in neue Welten: Papier, Himmel, Weltraum, Neon.</p></div>`;
 $('cd').innerHTML=h;$('nav').hidden=k=='over'||k=='pause'||k=='revive';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.a==(k=='tut'?'set':k)));if(k=='lb')loadLb();const old=c;document.querySelectorAll('.pv').forEach(v=>{c=v.getContext('2d');c.setTransform(1.3,0,0,1.3,0,0);drawChar(+v.dataset.k,32,70,1,-3,0,0)});c=old}
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;snd(500,.06,'triangle',.04);navigator.vibrate&&navigator.vibrate(8);
 if(a=='start'){if(D.tilt)enableTilt();tiltBase=tiltS;try{const de=document.documentElement;if(de.requestFullscreen&&!document.fullscreenElement)de.requestFullscreen().catch(()=>{})}catch(x){}start()}else if(a=='resume'){tiltBase=tiltS;$('ov').hidden=true;state='play';last=performance.now()}else if(a=='tilt'){D.tilt=!D.tilt;sv();if(D.tilt)enableTilt();else tiltOn=false;menu('set')}else if(a=='main'){['hud','sb','pb','tm'].forEach(i=>$(i).hidden=true);state='menu';menu('main')}else if(a=='upg'||a=='skin'||a=='tut'||a=='lb'||a=='set')menu(a);
 else if(a=='revive')showAd('reward',()=>{const g=G,p=g.p;g.pl.push({x:W/2-32,y:g.cam+H*.75,w:64,t:'n'});p.x=W/2-19;p.y=g.cam+H*.75-p.h;p.vy=-12.5;p.lives=1;p.inv=2500;p.sh=3000;g.zz=14;$('ov').hidden=true;['sb','pb'].forEach(i=>$(i).hidden=false);state='play';last=performance.now()});else if(a=='giveup'){G.no=1;fin()}else if(a=='adc')showAd('reward',()=>{D.coins+=50;G.run+=50;G.adc=1;sv();menu('over')});else if(a=='out'){D.acc=null;sv();menu('set')}else if(a=='sens'){D.sens=D.sens==.7?1:D.sens==1?1.5:.7;sv();menu('set')}else if(a=='snd'){D.mute=!D.mute;sv();menu('set')}else if(a=='am'){const n=$('an');lastN=n?n.value:'';am=v;menu('set')}else if(a=='go')doAuth(am);else if(a=='eye'){const i=$('ap');i.type=i.type=='password'?'text':'password'}else if(a=='bu'){const l=D.up[v],cs=UP[v].c[l];if(cs!==undefined&&D.coins>=cs){D.coins-=cs;D.up[v]++;sv();menu('upg')}}
 else if(a=='bs'){const s=SK[v];if(D.coins>=s.p){D.coins-=s.p;D.own.push(+v);D.skin=+v;sv();menu('skin')}}
 else if(a=='ss'){D.skin=+v;sv();menu('skin')}});

/* ---------- Eingabe & Start ---------- */
const WR=$('wrap');
WR.addEventListener('pointerdown',e=>{if(state!='play'||e.target.closest('button'))return;const r=WR.getBoundingClientRect();ptr[e.pointerId]=e.clientX<r.left+r.width/2?-1:1});
WR.addEventListener('pointermove',e=>{if(ptr[e.pointerId]!==undefined){const r=WR.getBoundingClientRect();ptr[e.pointerId]=e.clientX<r.left+r.width/2?-1:1}});
['pointerup','pointercancel','pointerleave'].forEach(n=>WR.addEventListener(n,e=>delete ptr[e.pointerId]));
$('ov').addEventListener('keydown',e=>{if(e.key=='Enter'&&['an','ap','ap2'].includes(e.target.id))doAuth(am)});
$('sb').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==' '||e.key=='ArrowUp'){shoot();e.preventDefault()}});
addEventListener('keyup',e=>delete keys[e.key]);
let tiltS=0,tiltBase=0,tilt=0,tiltOn=false,tiltGot=false,tiltFail=false,tiltBound=false;
if(D.tilt===undefined)D.tilt='ontouchstart' in window;
function onTilt(e){if(e.gamma==null)return;const first=!tiltGot;tiltGot=true;const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;tilt=ang==90?e.beta:(ang==-90||ang==270)?-e.beta:ang==180?-e.gamma:e.gamma;tiltS=first?tilt:tiltS+(tilt-tiltS)*.3;if(first)tiltBase=tiltS}
async function enableTilt(){try{if(typeof DeviceOrientationEvent!='undefined'&&DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!='granted'){D.tilt=false;tiltFail=true;sv();return}}catch(e){D.tilt=false;tiltFail=true;return}
 if(!tiltBound){addEventListener('deviceorientation',onTilt);tiltBound=true}tiltOn=true;tiltFail=false;
 setTimeout(()=>{if(!tiltGot&&tiltOn){tiltOn=false;tiltFail=true;D.tilt=false;if(!$('ov').hidden&&$('cd').querySelector('[data-a=tilt]'))menu('set')}},1500)}
$('pb').addEventListener('pointerdown',e=>{e.preventDefault();if(state=='play'){state='pause';ptr={};menu('pause')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state=='play'){state='pause';ptr={};menu('pause')}});

/* ---------- Account, Rangliste, Cloud ---------- */
const esc=t=>String(t).replace(/[&<>"']/g,m=>'&#'+m.charCodeAt(0)+';');
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(D.acc?{Authorization:'Bearer '+D.acc.token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&D.acc){D.acc=null;sv()}throw new Error(j.error||'Fehler')}return j}
const pack=()=>({coins:D.coins,hi:D.hi,skin:D.skin,own:D.own,up:D.up});
function mergeData(s){if(!s)return;D.coins=Math.max(D.coins,s.coins|0);D.hi=Math.max(D.hi,s.hi|0);(s.own||[]).forEach(i=>{if(!D.own.includes(i))D.own.push(i)});for(const k in D.up)D.up[k]=Math.max(D.up[k],(s.up&&s.up[k])|0);if(D.own.includes(s.skin))D.skin=s.skin}
function pushData(){if(D.acc)api('save',{data:pack()}).catch(()=>{})}
async function doAuth(a){const n=$('an').value.trim(),pw=$('ap').value,e=$('ae'),bt=$('ago'),reg=a=='reg';
 if(!/^[A-Za-z0-9_\-äöüÄÖÜß]{3,16}$/.test(n))return e.textContent='Name: 3–16 Zeichen (Buchstaben, Zahlen, _ -)';
 if(pw.length<6)return e.textContent='Passwort: mind. 6 Zeichen';
 if(reg&&$('ap2')&&$('ap2').value!==pw)return e.textContent='Die Passwörter sind nicht gleich';
 e.textContent='';bt.disabled=true;bt.textContent='⏳ Bitte warten…';
 try{const j=await api(reg?'register':'login',{name:n,pw,data:pack()});D.acc={name:j.name,token:j.token};mergeData(j.data);sv();lastN='';menu('main')}catch(x){e.textContent=x.message=='Failed to fetch'?'Server nicht erreichbar (nur online auf Netlify).':x.message;bt.disabled=false;bt.textContent=reg?'Account erstellen':'Anmelden'}}
function pvs(){const old=c;document.querySelectorAll('.pv').forEach(v=>{c=v.getContext('2d');c.setTransform(1.3,0,0,1.3,0,0);drawChar(+v.dataset.k,32,70,1,-3,0,0)});c=old}
async function loadLb(){const el=$('lbl'),me=D.acc&&D.acc.name.toLowerCase();try{const j=await api('top');
 const row=(r,i)=>`<div class="rw r${i<3?i+1:0}${me==r.name.toLowerCase()?' me':''}"><b class="rk">${['🥇','🥈','🥉'][i]||i+1}</b><canvas class="pv sm" width="84" height="96" data-k="${r.skin|0}"></canvas><span>${esc(r.name)}</span><b>${r.score}</b></div>`;
 el.innerHTML=(j.top.length?j.top.map(row).join(''):'Noch keine Einträge – sei der Erste!')+(j.me&&j.me.rank>50?`<div class="rw me gap"><b class="rk">#${j.me.rank}</b><span>Du</span><b>${j.me.score}</b></div>`:'')+(D.acc?(j.me?'':'<p class="hint">Spiele eine Runde, um dich einzutragen!</p>'):'<p class="hint">Account unter ⚙️ Setup erstellen, um dich einzutragen.</p>')+'<button class="b bg" data-a="lb">↻ Aktualisieren</button>';pvs()}catch(e){if(el)el.textContent='Rangliste nicht erreichbar (läuft nur online auf Netlify).'}}
if(D.acc)api('me').then(j=>{mergeData(j.data);sv()}).catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- Werbung (Google AdSense) ----------
   Deine ID kommt in ads-config.js. */
const C0=window.ADS_CFG||{},ADS={client:C0.client||'',test:C0.test!==false,every:3,minGap:120000};let lastAd=0;let am='login',lastN='';
const HOUSE=C0.house&&C0.house.length?C0.house:[{e:'🎮',t:'Danke fürs Spielen!',d:'Erzähl deinen Freunden vom Doodle Jumper und knackt gemeinsam neue Rekorde.',u:'',c:'#ffd166'}];
if(ADS.client){window.adsbygoogle=window.adsbygoogle||[];window.adBreak=window.adConfig=o=>adsbygoogle.push(o);const sc=document.createElement('script');sc.async=1;sc.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+ADS.client;sc.crossOrigin='anonymous';sc.onerror=()=>{ADS.fail=1};sc.dataset.adFrequencyHint='30s';if(ADS.test)sc.dataset.adbreakTest='on';document.head.appendChild(sc);adConfig({preloadAdBreaks:'on',sound:'on'})}
function showAd(kind,cb){lastAd=Date.now();
 const house=()=>{const a=HOUSE[Math.floor(Math.random()*HOUSE.length)],el=$('ad');let n=5;el.hidden=false;
  el.innerHTML=`<div class="card"><div class="adl">ANZEIGE</div><div class="adart" style="background:${a.c||'#ffd166'}">${a.e}</div><h2>${esc(a.t)}</h2><p>${esc(a.d)}</p>${a.u?`<a class="b bl" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(a.u)}">Mehr erfahren</a>`:''}<button class="b bg" id="adx" disabled>Weiter in ${n}s</button></div>`;
  const b=$('adx'),iv=setInterval(()=>{n--;if(n>0)b.textContent='Weiter in '+n+'s';else{clearInterval(iv);b.disabled=false;b.textContent='🎁 Belohnung holen'}},1000);
  b.onclick=()=>{el.hidden=true;cb()}};
 if(!ADS.client||ADS.fail||!window.adBreak)return house();
 let got=false,fin=false,tm;const one=f=>{if(fin)return;fin=true;clearTimeout(tm);f()};
 tm=setTimeout(()=>{if(!got)one(house)},5000);
 adBreak({type:'reward',name:'reward',beforeReward:s=>{got=true;clearTimeout(tm);s()},adViewed:()=>one(cb),adBreakDone:()=>{if(!got)one(house);else one(()=>{})}})}
function loop(n){const dt=Math.min(2.5,(n-last)/16.67||1);last=n;if(state=='play')upd(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',rs);rs();menu('main');requestAnimationFrame(loop);
